# A release: push a tag `v<version>` matching Cargo.toml's version.
#
#   verify   the tag, the CHANGELOG sections (English and Chinese), the update keys
#   macos    per-architecture apps: signed, notarized, stapled; update zip and DMG
#   windows  per-user Inno Setup installer (unsigned for now) and portable zip
#   linux    AppImage
#   publish  (environment `release`, approved by hand) uploads to R2 behind
#            dl.shellrs.com, creates the GitHub release, and only then
#            replaces the channel's manifest, which is what clients follow;
#            the manifest lists the GitHub release as each package's
#            second address; last, it has Cloudflare rebuild shellrs.com,
#            whose download page and changelog read that manifest
#
# A tag with a pre-release (v0.3.0-beta.1) goes to the beta channel only. A
# stable release also becomes the beta channel's, unless beta is ahead.
#
# Running it by hand (workflow_dispatch) builds and packages from the
# current commit without publishing, to try the pipeline.
#
# Secrets, see docs/release.md:
#   repository: APPLE_CERTIFICATE_P12 (base64), APPLE_CERTIFICATE_PASSWORD,
#               APPLE_SIGNING_IDENTITY, APPLE_TEAM_ID, APPLE_API_KEY_P8
#               (base64), APPLE_API_KEY_ID, APPLE_API_ISSUER
#   environment `release`: MINISIGN_SECRET_KEY, MINISIGN_PASSWORD,
#               R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
#               R2_BUCKET, CF_ZONE_ID, CF_API_TOKEN, SITE_DEPLOY_HOOK
name: release

on:
  push:
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Version and channel
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag_ver="${GITHUB_REF_NAME#v}"
            if [ -n "$tag_ver" ]; then
              version="$tag_ver"
            fi
          fi
          case "$version" in *-*|*.rc*|*rc*) channel=beta ;; *) channel=stable ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      # The GitHub release takes the English section; the website shows
      # CHANGELOG.zh.md on its Chinese pages, so that one must have it too.
      - name: Release notes from CHANGELOG.md
        run: |
          version=${{ steps.version.outputs.version }}
          base_version=$(echo "$version" | sed -E 's/[.-]?(rc|beta|alpha).*//')
          section() {
            awk -v heading="## [$version]" -v base="## [$base_version]" '
              index($0, heading) == 1 || index($0, base) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' "$1" | sed -e '/./,$!d'
          }
          notes=$(section CHANGELOG.md)
          if [ -z "$notes" ]; then
            notes="Release $version"
          fi
          echo "$notes" > notes.md
          cat notes.md
      - name: The build knows the update keys
        run: |
          if grep -q 'pub const TRUSTED_KEYS: &\[&str\] = &\[\];' src/update/build_info.rs; then
            echo "::error::src/update/build_info.rs has no TRUSTED_KEYS: a release would reject every update"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  # macos job temporarily skipped
  # macos:
  #   needs: verify
  #   runs-on: macos-15
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       arch: [aarch64, x86_64]
  #   ...

  windows:
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      SHELLRS_UPDATE_CHANNEL: ${{ needs.verify.outputs.channel }}
      SHELLRS_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/setup-nasm@v1
      - name: Build
        shell: bash
        run: |
          export SHELLRS_BUILD_DATE=$(date -u +%Y-%m-%d)
          cargo build --release --locked --bins
      - name: Runtime
        shell: pwsh
        run: ./scripts/windows-runtime.ps1 target/release
      - name: Installer
        shell: pwsh
        run: |
          # windows-2025 ships Inno Setup 6.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y; }
          & $iscc "/DAppVersion=$env:VERSION" "/DBuildDir=$env:GITHUB_WORKSPACE\target\release" `
            "/O$env:GITHUB_WORKSPACE\dist" packaging\windows\shellrs.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Portable
        shell: pwsh
        run: |
          # The portable zip, also what a portable copy updates from: both
          # programs at its root beside an empty data folder, which is what
          # makes a copy portable. 7-Zip keeps the empty folder;
          # Compress-Archive would drop it.
          $folder = Join-Path $env:RUNNER_TEMP "portable"
          New-Item -ItemType Directory -Force -Path (Join-Path $folder "data") | Out-Null
          Copy-Item "target\release\shellrs.exe", "target\release\shellrs-cli.exe" $folder
          $zip = "$env:GITHUB_WORKSPACE\dist\ShellRS-$env:VERSION-windows-x86_64-portable.zip"
          Push-Location $folder
          7z a -tzip -mx=9 $zip shellrs.exe shellrs-cli.exe data
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          # The first path listed is the archive itself.
          $entries = 7z l -slt $zip | Select-String '^Path = ' |
            ForEach-Object { $_.Line.Substring(7) } | Select-Object -Skip 1
          if (Compare-Object @($entries) @('data', 'shellrs-cli.exe', 'shellrs.exe')) {
            Write-Error "The portable zip holds: $($entries -join ', ')"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    needs: verify
    # Built in Ubuntu 20.04 so the AppImage runs on its glibc (2.31) and
    # later: Ubuntu 20.04, Debian 11, and the newer ones (issue #28).
    # GitHub has no 20.04 runners any more, hence the container.
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      SHELLRS_UPDATE_CHANNEL: ${{ needs.verify.outputs.channel }}
      SHELLRS_COMMIT: ${{ github.sha }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git file \
            build-essential cmake clang pkg-config libfontconfig-dev \
            libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev libdbus-1-dev libssl-dev
      - uses: actions/checkout@v4
      - name: Rust
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: rustup toolchain install
      # Its own cache: build scripts compiled on a newer glibc do not run here.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-20.04
      - name: Build
        run: |
          export SHELLRS_BUILD_DATE=$(date -u +%Y-%m-%d)
          cargo build --release --locked --bin shellrs
      - name: Needs glibc 2.31 at most
        run: |
          needed=$(objdump -T target/release/shellrs | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "The binary needs $needed"
          test "$(printf '%s\n' "$needed" GLIBC_2.31 | sort -V | tail -1)" = GLIBC_2.31
      - name: AppImage
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          # No FUSE on the runner: let the tool unpack itself.
          export APPIMAGE_EXTRACT_AND_RUN=1
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool" \
            packaging/linux/appimage.sh target/release/shellrs "$VERSION" dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  publish:
    needs: [verify, windows, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      CHANNEL: ${{ needs.verify.outputs.channel }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect
        run: |
          mkdir -p dist
          cp artifacts/windows/* artifacts/linux/* dist/
          cp artifacts/notes/notes.md notes.md
          cd dist
          sha256sum ShellRS-* > SHA256SUMS
          ls -l
      - name: GitHub release
        run: |
          prerelease=""
          [ "$CHANNEL" = beta ] && prerelease="--prerelease"
          tag_name="${GITHUB_REF_NAME:-v$VERSION}"
          if gh release view "$tag_name" >/dev/null 2>&1; then
            gh release upload "$tag_name" dist/* --clobber
          else
            gh release create "$tag_name" dist/* --title "ShellRS $VERSION" \
              --notes-file notes.md $prerelease
          fi
